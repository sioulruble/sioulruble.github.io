  }

const POINTS_PER_LEVEL = 4;
const BIRD_R = 40;       // display radius
const GRAVITY = 0.22;
const FLAP = -6.5;
const BASE_SPEED = 1.6;

// ── Image loading ──────────────────────────────────────────
// Load pre-segmented transparent PNGs directly
const sprites = [null, null, null];

FACE_DATA.forEach((fd, i) => {
  const img = new Image();
  img.src = fd.src;
  img.onload = () => {
    const sz = BIRD_R * 2;
    const oc = document.createElement('canvas');
    oc.width = sz; oc.height = sz;
    const c = oc.getContext('2d');
    // Draw the transparent PNG into a circle
    c.save();
    c.beginPath();
    c.arc(sz / 2, sz / 2, sz / 2 - 1, 0, Math.PI * 2);
    c.clip();
    c.drawImage(img, 0, 0, sz, sz);
    c.restore();
    // White border ring
    c.beginPath();
    c.arc(sz / 2, sz / 2, sz / 2 - 1, 0, Math.PI * 2);
    c.strokeStyle = 'rgba(255,255,255,0.88)';
    c.lineWidth = 3;
    c.stroke();
    sprites[i] = oc;
  };
  img.onerror = () => { sprites[i] = false; };
});

// ── Particles ──────────────────────────────────────────────
const particles = [];
function spawnParticle(x, y, color) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.8) * 4,
      life: 1.0,
      r: 3 + Math.random() * 4,
      color
    });
  }
}

// ── Background decorations ─────────────────────────────────
const bgElems = { buildings: [], smoke: [], petals: [], mountains: [] };

// Level 1 - Urban buildings
for (let i = 0; i < 8; i++) {
  bgElems.buildings.push({ x: i * 58 + Math.random() * 15, w: 36 + Math.random() * 28, h: 70 + Math.random() * 110 });
}
// Level 2 - Factory smoke particles
for (let i = 0; i < 24; i++) {
  bgElems.smoke.push({ slot: i % 3, t: Math.random() * 200, r: 10 + Math.random() * 14, wobble: Math.random() * Math.PI * 2 });
}
// Level 3 - Cherry blossom petals
for (let i = 0; i < 28; i++) {
  bgElems.petals.push({ x: Math.random() * W, y: Math.random() * (H - 110), vy: 0.4 + Math.random() * 0.6, vx: -0.3 - Math.random() * 0.4, wobble: Math.random() * Math.PI * 2, ws: 0.02 + Math.random() * 0.03, r: 3 + Math.random() * 4 });
}
// Level 3 - Background mountains
bgElems.mountains = [
  { x: 0,   w: 180, h: 160 },
  { x: 140, w: 150, h: 120 },
  { x: 270, w: 200, h: 180 },
];

// ── Game state ─────────────────────────────────────────────
let state = 'start'; // start | play | dead
let bird, pipes, particles_arr, score, level, frame, highScore = 0;
let levelFlash = 0;
let deathShake = 0;
let proutBurst = 0;

function init() {
  bird = { x: 110, y: H / 2, vy: 0 };
  pipes = [];
  score = 0;
  level = 0;
  frame = 0;
  levelFlash = 0;
  deathShake = 0;
  proutBurst = 0;
  particles.length = 0;
}

function getLevel() { return Math.min(Math.floor(score / POINTS_PER_LEVEL), 2); }

function addPipe() {
  const minTop = 70, minBot = 110;
  const gap = 220 - level * 5;
  const topH = minTop + Math.random() * (H - 120 - minTop - minBot - gap);
  pipes.push({ x: W + 50, topH, gap, scored: false });
}

// ── Input ──────────────────────────────────────────────────
function tap() {
  if (state === 'start') {
    state = 'play';
    bird.vy = FLAP;
    spawnParticle(bird.x, bird.y, THEMES[0].particles);
    return;
  }
  if (state === 'dead') {
    state = 'start';
    init();
    return;
  }
  bird.vy = FLAP;
  spawnParticle(bird.x, bird.y, THEMES[level].particles);
}

canvas.addEventListener('click', tap);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); tap(); }
});

// ── Draw helpers ───────────────────────────────────────────
function rr(x, y, w, h, r) {
  if (h < 1) return;
  r = Math.min(r, w / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground(t, tm) {
  // Sky
  const g = ctx.createLinearGradient(0, 0, 0, H - 110);
  g.addColorStop(0, t.skyTop);
  g.addColorStop(1, t.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H - 110);

  if (level === 0) {
    // ── Level 1 : Rue avec voiture et bâtiments ──
    // Sun
    const sg = ctx.createRadialGradient(W - 70, 50, 0, W - 70, 50, 80);
    sg.addColorStop(0, 'rgba(255,230,80,0.5)');
    sg.addColorStop(1, 'rgba(255,230,80,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H - 110);
    ctx.beginPath(); ctx.arc(W - 70, 50, 28, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,220,60,0.9)'; ctx.fill();

    // Buildings silhouettes
    bgElems.buildings.forEach(b => {
      const by = H - 110 - b.h;
      ctx.fillStyle = '#3A4A5C';
      ctx.fillRect(b.x, by, b.w, b.h);
      // Windows
      for (let wx = b.x + 5; wx < b.x + b.w - 8; wx += 11) {
        for (let wy = by + 8; wy < H - 118; wy += 15) {
          const lit = Math.sin((wx * 37 + wy * 13) * 0.01) > 0.1;
          ctx.fillStyle = lit ? 'rgba(255,230,120,0.7)' : 'rgba(60,80,120,0.5)';
          ctx.fillRect(wx, wy, 7, 9);
        }
      }
    });

    // Road markings on ground area
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    const dashOff = (tm * 2) % 60;
    for (let dx = -dashOff; dx < W; dx += 60) {
      ctx.fillRect(dx, H - 65, 36, 6);
    }

    // Car silhouette
    const carX = 20 + (tm * 0.5) % (W + 120) ;
    const carY = H - 110;
    ctx.fillStyle = '#C0392B';
    ctx.fillRect(carX, carY - 28, 80, 18);     // body
    ctx.fillRect(carX + 14, carY - 44, 48, 18); // roof
    ctx.fillStyle = 'rgba(180,230,255,0.6)';
    ctx.fillRect(carX + 18, carY - 42, 18, 14); // windshield
    ctx.fillRect(carX + 40, carY - 42, 18, 14); // rear window
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(carX + 16, carY - 10, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(carX + 64, carY - 10, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#555';
    ctx.beginPath(); ctx.arc(carX + 16, carY - 10, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(carX + 64, carY - 10, 5, 0, Math.PI * 2); ctx.fill();
    // Headlight
    ctx.fillStyle = 'rgba(255,255,180,0.9)';
    ctx.fillRect(carX + 74, carY - 24, 6, 5);

  } else if (level === 1) {
    // ── Level 2 : Usine ──
    // Ember glow from bottom
    const eg = ctx.createRadialGradient(W / 2, H - 110, 0, W / 2, H - 110, 300);
    eg.addColorStop(0, 'rgba(255,100,0,0.18)');
    eg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = eg; ctx.fillRect(0, 0, W, H - 110);

    // Factory building (big block)
    ctx.fillStyle = '#2A2010';
    ctx.fillRect(60, H - 260, 280, 150);
    // Factory windows (grid)
    for (let fx = 75; fx < 335; fx += 32) {
      for (let fy = H - 248; fy < H - 125; fy += 28) {
        const glow = Math.sin(tm * 0.03 + fx * 0.1 + fy * 0.07) > 0.5;
        ctx.fillStyle = glow ? 'rgba(255,140,0,0.6)' : 'rgba(80,50,0,0.5)';
        ctx.fillRect(fx, fy, 20, 18);
      }
    }
    // Pipes on factory
    ctx.fillStyle = '#3A3020';
    ctx.fillRect(58, H - 230, 8, 120);
    ctx.fillRect(332, H - 200, 8, 90);
    ctx.fillRect(58, H - 180, 60, 8);

    // Chimneys
    const chimneyXs = [100, 190, 290];
    chimneyXs.forEach((cx2, ci) => {
      ctx.fillStyle = '#1A1008';
      ctx.fillRect(cx2 - 12, H - 320 - ci * 20, 24, 80 + ci * 20);
      // Chimney cap
      ctx.fillStyle = '#2A2010';
      ctx.fillRect(cx2 - 16, H - 326 - ci * 20, 32, 10);
    });

    // Animated smoke
    bgElems.smoke.forEach(s => {
      s.t += 0.4;
      const cx2 = chimneyXs[s.slot];
      const age = s.t % 200;
      const sy = H - 330 - s.slot * 20 - age * 0.6;
      const sx = cx2 + Math.sin(s.wobble + age * 0.04) * 14;
      const sr = s.r * (0.5 + age / 200);
      if (sy < H - 110) {
        const sg2 = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
        sg2.addColorStop(0, `rgba(120,100,80,${0.35 * (1 - age / 200)})`);
        sg2.addColorStop(1, 'rgba(60,50,40,0)');
        ctx.fillStyle = sg2;
        ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
      }
    });

    // Grid overlay
    ctx.strokeStyle = 'rgba(255,80,0,0.06)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H - 110); ctx.stroke(); }
    for (let y = 0; y < H - 110; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  } else {
    // ── Level 3 : Temple japonais ──
    // Mountains
    bgElems.mountains.forEach(m => {
      ctx.fillStyle = 'rgba(180,130,160,0.35)';
      ctx.beginPath();
      ctx.moveTo(m.x, H - 110);
      ctx.lineTo(m.x + m.w / 2, H - 110 - m.h);
      ctx.lineTo(m.x + m.w, H - 110);
      ctx.closePath(); ctx.fill();
    });

    // Pagoda (3-tiered)
    const px = W - 110, py = H - 110;
    const tiers = [
      { w: 90, h: 30, roofW: 110, roofH: 18, dy: 0 },
      { w: 66, h: 26, roofW:  82, roofH: 15, dy: -48 },
      { w: 44, h: 22, roofW:  58, roofH: 13, dy: -88 },
    ];
    tiers.forEach(tier => {
      const tx = px - tier.w / 2, ty = py + tier.dy - tier.h;
      ctx.fillStyle = '#5C1A00';
      ctx.fillRect(tx, ty, tier.w, tier.h);
      // Roof (trapezoid via path)
      ctx.fillStyle = '#8B0000';
      ctx.beginPath();
      ctx.moveTo(px - tier.roofW / 2, ty);
      ctx.lineTo(px - tier.w / 2 + 4, ty - tier.roofH);
      ctx.lineTo(px + tier.w / 2 - 4, ty - tier.roofH);
      ctx.lineTo(px + tier.roofW / 2, ty);
      ctx.closePath(); ctx.fill();
      // Roof ridge highlight
      ctx.strokeStyle = 'rgba(220,80,60,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px - tier.w / 2 + 4, ty - tier.roofH);
      ctx.lineTo(px + tier.w / 2 - 4, ty - tier.roofH);
      ctx.stroke();
    });
    // Spire
    ctx.fillStyle = '#8B0000';
    ctx.beginPath();
    ctx.moveTo(px, py - 112); ctx.lineTo(px - 5, py - 100); ctx.lineTo(px + 5, py - 100);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#CC2200'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px, py - 112); ctx.lineTo(px, py - 130); ctx.stroke();

    // Torii gate (left side)
    ctx.fillStyle = '#CC2200';
    ctx.fillRect(30, H - 200, 10, 90);  // left pillar
    ctx.fillRect(85, H - 200, 10, 90);  // right pillar
    ctx.fillRect(22, H - 196, 80, 10);  // top beam (kashigi)
    ctx.fillRect(26, H - 182, 72, 7);   // second beam (nuki)

    // Cherry blossom petals
    bgElems.petals.forEach(p => {
      p.x += p.vx + Math.sin(p.wobble) * 0.3;
      p.y += p.vy;
      p.wobble += p.ws;
      if (p.y > H - 110) { p.y = -10; p.x = Math.random() * W; }
      if (p.x < -10) p.x = W + 5;
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.wobble);
      ctx.fillStyle = '#FFB7D5';
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  // Ground
  const gg = ctx.createLinearGradient(0, H - 110, 0, H);
  gg.addColorStop(0, t.groundTop);
  gg.addColorStop(1, t.ground);
  ctx.fillStyle = gg;
  ctx.fillRect(0, H - 110, W, 110);
  // Ground accent line
  ctx.fillStyle = t.accent;
  ctx.globalAlpha = 0.3;
  ctx.fillRect(0, H - 110, W, 3);
  ctx.globalAlpha = 1;
}

function drawPipe(pipe, t) {
  const pw = 50, cap = 8, capH = 24, rr_r = 6;

  function drawOnePipe(x, y, h, flipCap) {
    if (h <= 0) return;
    // Body
    ctx.fillStyle = t.pipe;
    rr(x, y, pw, h, rr_r);
    ctx.fill();
    // Shadow left
    ctx.fillStyle = t.pipeShadow;
    rr(x, y, 8, h, rr_r);
    ctx.fill();
    // Light right
    ctx.fillStyle = t.pipeLight;
    rr(x + pw - 6, y, 6, h, rr_r);
    ctx.fill();
    // Cap
    ctx.fillStyle = t.pipe;
    rr(x - cap, flipCap ? y : y + h - capH, pw + cap * 2, capH, rr_r);
    ctx.fill();
    ctx.fillStyle = t.pipeLight;
    rr(x - cap + pw + cap - 6, flipCap ? y : y + h - capH, 6, capH, rr_r);
    ctx.fill();
  }

  const px = pipe.x - pw / 2;
  drawOnePipe(px, 0, pipe.topH, false);
  const botY = pipe.topH + pipe.gap;
  drawOnePipe(px, botY, H - 110 - botY, true);
}

// Fart cloud blobs: negative ox = LEFT of bird (behind it as it flies right)
const FART_BLOBS = [
  { ox: -28, oy:  2, r: 22, phase: 0.0 },
  { ox: -46, oy: -8, r: 17, phase: 1.1 },
  { ox: -40, oy: 13, r: 15, phase: 2.2 },
  { ox: -58, oy:  0, r: 12, phase: 0.7 },
  { ox: -52, oy:-14, r: 11, phase: 1.8 },
];

function drawFart(wiggle) {
  const t = wiggle;
  // Stink wavy lines trailing LEFT
  for (let k = 0; k < 3; k++) {
    const ox = -30 - k * 18;
    const oy = -12 + k * 11;
    const phase = k * 1.4 + t * 0.06;
    ctx.save();
    ctx.globalAlpha = 0.4 + 0.15 * Math.sin(phase);
    ctx.strokeStyle = '#7EC800';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.bezierCurveTo(ox - 10, oy - 6, ox - 16, oy + 6, ox - 22, oy - 4);
    ctx.stroke();
    ctx.restore();
  }

  // Green cloud blobs
  FART_BLOBS.forEach(b => {
    const pulse = 1 + 0.12 * Math.sin(t * 0.08 + b.phase);
    const alpha = 0.55 + 0.15 * Math.sin(t * 0.05 + b.phase);
    const r = b.r * pulse;
    const g = ctx.createRadialGradient(b.ox, b.oy, 0, b.ox, b.oy, r);
    g.addColorStop(0,   `rgba(160,220,0,${alpha})`);
    g.addColorStop(0.5, `rgba(120,180,0,${alpha * 0.7})`);
    g.addColorStop(1,   `rgba(80,140,0,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.ox, b.oy, r, 0, Math.PI * 2); ctx.fill();
  });

  // 💨 emoji drifting LEFT
  const drift = (t * 0.8) % 55;
  ctx.save();
  ctx.globalAlpha = Math.max(0, 1 - drift / 55);
  ctx.font = '16px serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('💨', -28 - drift, -6 - drift * 0.25);
  ctx.restore();
}

function drawProut() {
  if (proutBurst <= 0) return;
  const a = proutBurst / 90;
  proutBurst--;

  // Expanding green shockwave
  const r = (1 - a) * 160 + 20;
  ctx.save();
  ctx.globalAlpha = a * 0.55;
  const grad = ctx.createRadialGradient(bird.x, bird.y, 0, bird.x, bird.y, r);
  grad.addColorStop(0,   'rgba(180,255,0,0.9)');
  grad.addColorStop(0.5, 'rgba(100,210,0,0.5)');
  grad.addColorStop(1,   'rgba(40,140,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(bird.x, bird.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // "PROUT 💨" text fades in then out
  if (proutBurst > 15) {
    const ta = Math.min(1, (proutBurst - 15) / 30);
    ctx.save();
    ctx.globalAlpha = ta;
    ctx.textAlign = 'center';
    ctx.font = 'bold 54px Courier New';
    ctx.fillStyle = '#5DC800';
    ctx.shadowColor = '#2A7000';
    ctx.shadowBlur = 20;
    ctx.fillText('PROUT ! 💨', W / 2, H / 2 - 30);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

function drawBird(lvl, wiggle) {
  const sp = sprites[lvl];
  const angle = Math.max(-0.45, Math.min(0.55, bird.vy * 0.055));
  const sz = BIRD_R * 2;

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(bird.x, bird.y + BIRD_R + 4, BIRD_R * 0.7, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(bird.x + Math.sin(wiggle * 0.1) * 1.5, bird.y);
  ctx.rotate(angle);

  // Fart cloud behind face from level 2 (index >= 1)
  if (lvl >= 1) drawFart(wiggle);

  if (sp) {
    ctx.drawImage(sp, -BIRD_R, -BIRD_R, sz, sz);
  } else {
    const colors = ['#CD853F', '#4A90D9', '#FF6347'];
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.fillStyle = colors[lvl];
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.font = `${BIRD_R * 0.9}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(['😊', '😌', '😄'][lvl], 0, 0);
  }

  ctx.restore();
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.04;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawScore(t) {
  ctx.save();
  ctx.textAlign = 'center';
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.font = 'bold 52px Courier New';
  ctx.fillText(score, W / 2 + 2, 82);
  // Main
  ctx.fillStyle = 'white';
  ctx.fillText(score, W / 2, 80);
  // Level badge
  ctx.font = '13px Courier New';
  ctx.fillStyle = t.accent;
  ctx.globalAlpha = 0.9;
  ctx.fillText(FACE_DATA[level].label + ' · ' + t.name, W / 2, 105);
  ctx.restore();
}

function drawLevelFlash(t) {
  if (levelFlash <= 0) return;
  ctx.save();
  ctx.globalAlpha = levelFlash * 0.25;
  ctx.fillStyle = t.accent;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // Level text
  if (levelFlash > 0.4) {
    ctx.save();
    ctx.globalAlpha = (levelFlash - 0.4) / 0.6;
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px Courier New';
    ctx.fillStyle = 'white';
    ctx.shadowColor = t.accent;
    ctx.shadowBlur = 20;
    ctx.fillText('NIVEAU ' + (level + 1) + ' !', W / 2, H / 2 - 20);
    ctx.font = '16px Courier New';
    ctx.fillText(FACE_DATA[level].label, W / 2, H / 2 + 15);
    ctx.restore();
  }
}

function drawOverlay(panel, t) {
  rr(W / 2 - 155, panel.y, 310, panel.h, 16);
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fill();
  ctx.strokeStyle = t.accent;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.4;
  rr(W / 2 - 155, panel.y, 310, panel.h, 16);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

let bgTime = 0;

// ── Main loop ──────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  bgTime++;

  const lvl = (state === 'play' || state === 'dead') ? level : 0;
  const t = THEMES[lvl];

  // Shake offset on death
  let sx = 0, sy = 0;
  if (deathShake > 0) {
    sx = (Math.random() - 0.5) * deathShake * 6;
    sy = (Math.random() - 0.5) * deathShake * 4;
    deathShake -= 0.08;
    if (deathShake < 0) deathShake = 0;
  }
  ctx.save();
  ctx.translate(sx, sy);

  drawBackground(t, bgTime);

  if (state === 'start') {
    // Animated bird preview
    const by_preview = H / 2 + 80 + Math.sin(bgTime * 0.04) * 20;
    const saved_y = bird.y, saved_vy = bird.vy;
    bird.y = by_preview; bird.vy = Math.sin(bgTime * 0.04) * 2;
    drawBird(0, bgTime);
    bird.y = saved_y; bird.vy = saved_vy;

    drawParticles();

    // Start panel
    const panel = { y: H / 2 - 145, h: 220 };
    drawOverlay(panel, THEMES[0]);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 34px Courier New';
    ctx.shadowColor = '#FF8C00';
    ctx.shadowBlur = 12;
    ctx.fillText('FLAPPY HEAD', W / 2, panel.y + 55);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '15px Courier New';
    ctx.fillText('3 niveaux · 3 visages', W / 2, panel.y + 92);

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '13px Courier New';
    ctx.fillText('Clic ou Espace pour voler', W / 2, panel.y + 125);

    if (highScore > 0) {
      ctx.fillStyle = '#FFD700';
      ctx.font = '14px Courier New';
      ctx.fillText('⭐ Record : ' + highScore, W / 2, panel.y + 165);
    }

    // Face previews at bottom
    const previewY = H - 80;
    for (let i = 0; i < 3; i++) {
      const px = W / 2 + (i - 1) * 70;
      const sp = sprites[i];
      const pr = 20;
      ctx.save();
      ctx.beginPath();
      ctx.arc(px, previewY, pr, 0, Math.PI * 2);
      ctx.fillStyle = THEMES[i].accent;
      ctx.globalAlpha = 0.25;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.clip();
      if (sp) ctx.drawImage(sp, px - pr, previewY - pr, pr * 2, pr * 2);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(px, previewY, pr, 0, Math.PI * 2);
      ctx.strokeStyle = THEMES[i].accent;
      ctx.lineWidth = 2;
      ctx.globalAlpha = i === 0 ? 1 : 0.4;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

  } else {
    // Game play / dead
    if (state === 'play') {
      frame++;
      // Physics
      bird.vy += GRAVITY;
      bird.y += bird.vy;

      // Pipe spawn
      if (frame % 130 === 0) addPipe();

      // Pipe updates
      const speed = BASE_SPEED + level * 0.18;
      for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= speed;
        // Collision (circle vs rectangles)
        const p = pipes[i];
        const pw = 50 + 8 * 2; // including caps
        const cx = bird.x, cy = bird.y, br = BIRD_R * 0.60;
        if (cx + br > p.x - pw / 2 && cx - br < p.x + pw / 2) {
          if (cy - br < p.topH || cy + br > p.topH + p.gap) {
            state = 'dead';
            deathShake = 1.5;
            spawnParticle(bird.x, bird.y, '#FF4444');
            if (score > highScore) highScore = score;
          }
        }
        // Score
        if (!p.scored && p.x < bird.x) {
          p.scored = true;
          score++;
          const newLvl = getLevel();
          if (newLvl > level) {
            level = newLvl;
            levelFlash = 1.2;
            if (level >= 1) proutBurst = 90;
            spawnParticle(bird.x, bird.y, THEMES[level].accent);
          }
          spawnParticle(p.x, bird.y, t.accent);
        }
        if (p.x < -70) pipes.splice(i, 1);
      }

      // Bounds
      if (bird.y + BIRD_R >= H - 110 || bird.y - BIRD_R <= 0) {
        state = 'dead';
        deathShake = 1.5;
        spawnParticle(bird.x, bird.y, '#FF4444');
        if (score > highScore) highScore = score;
      }

      levelFlash = Math.max(0, levelFlash - 0.03);
    }

    for (const pipe of pipes) drawPipe(pipe, t);
    drawParticles();
    drawProut();
    drawBird(level, frame);
    drawScore(t);
    drawLevelFlash(t);

    if (state === 'dead') {
      // Dead overlay
      const panel = { y: H / 2 - 135, h: 210 };
      drawOverlay(panel, t);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FF4444';
      ctx.font = 'bold 34px Courier New';
      ctx.shadowColor = '#FF0000';
      ctx.shadowBlur = 10;
      ctx.fillText('GAME OVER', W / 2, panel.y + 55);
      ctx.shadowBlur = 0;

      ctx.fillStyle = 'white';
      ctx.font = 'bold 26px Courier New';
      ctx.fillText('Score : ' + score, W / 2, panel.y + 98);

      if (score >= highScore && score > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = '15px Courier New';
        ctx.fillText('✦ Nouveau record ! ✦', W / 2, panel.y + 133);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '14px Courier New';
        ctx.fillText('Record : ' + highScore, W / 2, panel.y + 133);
      }

      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '13px Courier New';
      ctx.fillText('Clic pour rejouer', W / 2, panel.y + 175);
    }
  }

  ctx.restore();
}

init();
loop();
</script>
